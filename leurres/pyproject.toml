[project]
name = "orbis-surface"
version = "0.1.0"
description = "Dedale — surface exposee d'Orbis Pay : site, API, doc, MCP leurre, labyrinthe (hackathon Secure Horizons, tout fictif)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
