[project]
name = "dedale-messagerie"
version = "0.1.0"
description = "Garde-mail de Dédale : boîte de démo locale (Mailpit), analyseur explicable, service de verdicts."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
