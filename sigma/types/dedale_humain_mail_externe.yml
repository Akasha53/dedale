title: 'sAIfe : Données sensibles envoyées vers une adresse extérieure'
id: 8a01bd8d-135b-5ed2-9d6b-61f8baa097a2
status: test
description: Le salarié a envoyé des données sensibles à une adresse hors de l'entreprise après l'alerte.
references:
- https://attack.mitre.org/techniques/T1048/
author: sAIfe (Secure Horizons)
date: '2026-10-10'
tags:
- attack.exfiltration
- attack.t1048
logsource:
  product: dedale
  category: exfiltration
detection:
  selection:
    event.module: dedale
    event.action: avertissement
    event.dataset: dedale.humain
    labels.categorie: mail_externe
    event.type: allowed
  condition: selection
fields:
- user.name
- user.group.name
- url.domain
- destination.domain
- dedale.incident.id
falsepositives:
- Envoi prévu à un cabinet comptable ou un avocat
level: high
