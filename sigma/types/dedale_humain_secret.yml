title: 'sAIfe : Salarié qui expose un secret malgré l''alerte'
id: 0df16999-6060-55a7-8e25-957117050949
status: test
description: Le poste a repéré un mot de passe ou une clé d'API sur le point de partir (collé dans un chat, un mail,
  un document) et le salarié a continué.
references:
- https://attack.mitre.org/techniques/T1552/001/
author: sAIfe (Secure Horizons)
date: '2026-10-10'
tags:
- attack.credential-access
- attack.t1552.001
logsource:
  product: dedale
  category: identifiants
detection:
  selection:
    event.module: dedale
    event.action: avertissement
    event.dataset: dedale.humain
    labels.categorie: secret
    event.type: allowed
  condition: selection
fields:
- user.name
- user.group.name
- url.domain
- destination.domain
- dedale.incident.id
falsepositives:
- Clé de test sans droit, déjà révoquée
level: high
