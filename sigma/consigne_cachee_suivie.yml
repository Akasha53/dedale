title: Agent IA ayant suivi une consigne cachée (injection via leurre)
id: 7c1e0a44-0b1a-4e2a-9b11-2d6f9a0c1001
status: experimental
description: >
  Un leurre de type consigne_cachée a été déclenché dans la même session qu'une lecture de
  document ou de mail. Seul un programme qui lit et interprète le texte suit une instruction
  dissimulée : signal fort d'agent IA détourné (prompt injection).
references:
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://genai.owasp.org/
author: sAIfe (Secure Horizons)
logsource:
  product: dedale
detection:
  selection:
    event.action: leurre_touche
    dedale.leurre_nature: consigne_cachee
  condition: selection
fields:
  - dedale.session_id
  - dedale.leurre_id
  - dedale.surface
falsepositives:
  - Session de test du banc d'attaque (details.verite_terrain != agent_ia)
level: high
tags:
  - attack.t1566.001
