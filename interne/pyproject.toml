[project]
name = "orbis-interne"
version = "0.1.0"
description = "Agent interne d'Orbis Pay et passerelle boîte noire (module interne/ de Dédale)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# SDK Anthropic : utilisé seulement si ANTHROPIC_API_KEY est présent. Sans clé, l'agent
# passe par `claude -p` et n'a besoin d'aucune dépendance.
api = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
