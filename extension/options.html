<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réglages de sAIfe</title>
  <link rel="icon" href="icones/icone-32.png">
  <link rel="stylesheet" href="commun.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options">
    <header class="entete">
      <img src="icones/icone-48.png" width="40" height="40" alt="">
      <div>
        <h1>Réglages</h1>
        <p class="sous-titre">sAIfe, protection contre les sites louches</p>
      </div>
    </header>

    <form id="formulaire" class="carte" novalidate>
      <label class="champ">
        <span class="etiquette">Nom affiché</span>
        <input id="nom" type="text" maxlength="60" autocomplete="off">
        <span class="aide">Il apparaît dans l'avertissement d'un sosie de vos domaines : « Ce site imite Orbis Pay. »</span>
      </label>

      <label class="champ">
        <span class="etiquette">Domaines de confiance</span>
        <textarea id="domaines" rows="4" spellcheck="false" autocomplete="off"></textarea>
        <span class="aide">Un domaine par ligne, sous-domaines compris. Les marques connues (banques, impôts, PayPal…) sont déjà protégées par les règles communes.</span>
      </label>

      <label class="champ">
        <span class="etiquette">Adresse du backend sAIfe</span>
        <input id="backend" type="url" spellcheck="false" autocomplete="off">
        <span class="aide">Elle reçoit le nom d'un site louche quand quelqu'un continue malgré l'avertissement.</span>
      </label>

      <label class="champ">
        <span class="etiquette">Jeton du poste</span>
        <input id="jeton" type="password" spellcheck="false" autocomplete="off">
        <span class="aide">Contenu de ~/.config/dedale/jeton-poste. Sans lui, le backend refuse les signalements.</span>
      </label>

      <div class="pied">
        <button class="bouton principal" type="submit">Enregistrer</button>
        <p id="statut" class="statut" role="status"></p>
      </div>
    </form>

    <section class="carte">
      <h2>Tester une adresse</h2>
      <p class="aide">Passez une adresse aux règles de sAIfe, sans l'ouvrir.</p>
      <input id="essai" type="text" spellcheck="false" autocomplete="off" placeholder="orbispay-verification.example" aria-label="Adresse à tester">
      <p id="resultat" class="resultat" aria-live="polite"></p>
    </section>

    <section class="carte rangee">
      <p id="compteur" class="compteur"></p>
      <button class="bouton secondaire" type="button" id="zero">Remettre à zéro</button>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
